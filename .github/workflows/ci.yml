name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mixed Node versions across workspaces, deliberately (decision 130,
  # 2026-08-28): astro@7.2.9 clears apps/web's HIGH/CRITICAL npm-audit
  # advisories (unfixable on the astro@5.x line) but requires Node >=22.
  # apps/mobile and ci/scripts stay on Node 20 LTS. See apps/web/.nvmrc,
  # apps/web/astro.config.mjs, and .spark/environment.md.
  NODE_VERSION: "20"
  NODE_VERSION_WEB: "22"

jobs:
  lint:
    name: Lint (Node 20 — apps/mobile, ci/scripts, and everything not apps/web)
    runs-on: ubuntu-latest
    # ESLint itself doesn't execute Astro's runtime, so this could safely
    # cover apps/web too — but excluded here to keep this job's Node
    # version boundary literal and unambiguous. apps/web's own lint step
    # runs under Node 22 in the web-node22 job below.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx eslint apps/mobile ci/scripts --ext .ts,.tsx --max-warnings=0

  typecheck:
    name: Typecheck (Node 20 — apps/mobile, ci/scripts)
    runs-on: ubuntu-latest
    # apps/web's typecheck (astro check) requires Node 22 — see web-node22.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck ci/scripts
        run: npm run typecheck -w ci/scripts
      - name: Typecheck apps/mobile
        run: npm run typecheck -w apps/mobile

  test-ci-scripts:
    name: Test - ci/scripts (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test -w ci/scripts

  test-mobile:
    name: Test - apps/mobile (Jest, jest-expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test -w apps/mobile

  web-node22:
    name: apps/web (Node 22 — lint, typecheck, build, test, its slice of npm audit)
    runs-on: ubuntu-latest
    # apps/web is the ONE workspace pinned to Node 22 (decision 130) —
    # astro@7.2.9 requires it to clear the HIGH/CRITICAL advisories
    # unfixable on astro@5.x. Every other job in this workflow stays on
    # Node 20 LTS (env.NODE_VERSION). See apps/web/.nvmrc and
    # .spark/environment.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION_WEB }}
          cache: npm
      - run: npm ci
      - name: Lint apps/web
        run: npx eslint apps/web --ext .ts,.tsx --max-warnings=0
      - name: Typecheck apps/web (astro check)
        run: npm run typecheck -w apps/web
      - name: Build apps/web
        run: npm run build -w apps/web
      - name: Test apps/web (build + Vitest)
        run: npm run test -w apps/web
      - name: npm audit --audit-level=high (apps/web's slice, run under its own Node version)
        run: npm audit --audit-level=high

  check-bundle-keys:
    name: SEC-3 - check-bundle-keys (real expo export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsx ci/scripts/check-bundle-keys.ts

  check-migration-pairs:
    name: check-migration-pairs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsx ci/scripts/check-migration-pairs.ts

  check-rls-enabled:
    name: SEC-1 - check-rls-enabled (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsx ci/scripts/check-rls-enabled.ts

  supabase-integration:
    name: Supabase integration (migrations, SEC-2, SEC-4, Edge Functions)
    runs-on: ubuntu-latest
    # This is the CI-target path from .spark/environment.md: local Docker
    # stack, no real external credentials needed. GitHub-hosted ubuntu
    # runners have Docker pre-installed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Start local Supabase stack
        run: supabase start
      - name: Export local Supabase env vars
        id: supa-env
        run: |
          set -e
          STATUS_JSON=$(supabase status -o json)
          echo "SUPABASE_URL=$(echo "$STATUS_JSON" | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // .PUBLISHABLE_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=$(echo "$STATUS_JSON" | jq -r '.DB_URL')" >> "$GITHUB_ENV"
          echo "CRON_SHARED_SECRET=ci-test-cron-secret" >> "$GITHUB_ENV"

      # INF-2: schema change applies via migration on a clean DB and is
      # reversible. This resets the DB itself as its first step.
      - name: migration-reversibility-test (INF-2)
        run: npx tsx ci/scripts/migration-reversibility-test.ts

      # SEC-4: every view has security_invoker=true, checked against the
      # LIVE schema (re-reset to a clean, fully-migrated state first, since
      # the reversibility test above deliberately leaves the DB mid-cycle).
      - name: Reset DB to clean migrated state
        run: supabase db reset
      - name: check-security-invoker (SEC-4)
        run: npx tsx ci/scripts/check-security-invoker.ts

      # SEC-2: negative-authorization suite, blocks merge on every PR.
      - name: rls-negative-auth suite (SEC-2)
        run: npx tsx ci/scripts/rls-negative-auth/run.ts

      # INF-4 proof pair: scheduled-smoke-ok / scheduled-smoke-fail Deno
      # tests, invoking the handlers directly against the live local DB.
      - name: Deno tests - scheduled-smoke-ok/-fail (INF-4)
        working-directory: supabase/functions
        run: deno test --allow-net --allow-env tests/scheduled_smoke.integration.test.ts

      # INF-9 (auth-gating half): mint-storage-url's JWT/bucket-rule
      # enforcement. The real-R2 denied-read half runs separately (see
      # r2-denied-read-test job) since it needs real dev-tier R2 secrets.
      - name: Deno tests - mint-storage-url (INF-9 auth gating)
        working-directory: supabase/functions
        run: deno test --allow-net --allow-env tests/mint_storage_url.test.ts

      - name: Deno tests - send-test-push (auth gating)
        working-directory: supabase/functions
        run: deno test --allow-net --allow-env tests/send_test_push.test.ts

  r2-denied-read-test:
    name: INF-9 - r2-denied-read-test (real R2, secrets-gated)
    runs-on: ubuntu-latest
    # Honestly skips (exit 0 with a warning, not a silent pass) when the
    # R2_* / SUPABASE_* repository secrets aren't configured — see the
    # script itself. Configure these as repo secrets against the dev-tier
    # R2 buckets + dev cloud Supabase project per .spark/environment.md for
    # this to be a real gate.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsx ci/scripts/r2-denied-read-test.ts
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}

  posthog-funnel-merge-test:
    name: INF-6 - PostHog repeat-join funnel (merge to main only)
    runs-on: ubuntu-latest
    # External-system integration test, deliberately NOT run on every PR
    # (would flake ordinary PR merges on a third-party API) - only on push
    # to main, per the M0 spec. Honestly skips without real PostHog
    # ci-test-environment credentials configured - see the test file.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:merge -w ci/scripts
        env:
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_CAPTURE_API_KEY: ${{ secrets.POSTHOG_CI_TEST_CAPTURE_API_KEY }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_CI_TEST_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_CI_TEST_PROJECT_ID }}

  npm-audit:
    name: npm audit (--audit-level=high, Node 20, whole tree)
    runs-on: ubuntu-latest
    # Covers the full unified lockfile (npm audit isn't meaningfully
    # workspace-scoped — its results reflect the dependency tree, not the
    # active Node runtime). apps/web's own slice is re-run under its
    # correct Node 22 in the web-node22 job above; this job is the
    # general whole-repo gate.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
